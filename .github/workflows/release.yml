name: Release

'on':
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified artifacts to PyPI and GitHub
        type: boolean
        required: false
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Check public source hygiene
        run: uvx --from pytest pytest -p no:cacheprovider tests/test_public_safety.py -q
      - name: Check release version
        id: version
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tree = ast.parse(Path('manyruns/__init__.py').read_text())
          package_version, = [ast.literal_eval(node.value) for node in tree.body
                              if isinstance(node, ast.Assign)
                              and any(isinstance(target, ast.Name) and target.id == '__version__'
                                      for target in node.targets)]
          assert package_version == version
          tag = f'v{version}'
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == tag, 'Tag does not match package version'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx --from twine twine check --strict dist/*
      - name: Record artifact SHA-256 hashes
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Distribution SHA-256 hashes\n\n```text\n')
              for path in sorted(Path('dist').iterdir()):
                  if path.suffix == '.whl' or path.name.endswith('.tar.gz'):
                      summary.write(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n')
              summary.write('```\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  verify:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      # No checkout: imports and configs must come from the installed artifacts.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Verify the wheel and a wheel rebuilt from the sdist
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME VIRTUAL_ENV
          python_bin=$(command -v python)
          dist_dir="$GITHUB_WORKSPACE/dist"
          scratch=$(mktemp -d)
          trap 'rm -rf "$scratch"' EXIT
          cd "$scratch"
          for source in wheel sdist; do
            wheel_dir="$dist_dir"
            if [ "$source" = sdist ]; then
              uv build "$dist_dir"/*.tar.gz --wheel --python "$python_bin" --out-dir "$scratch/rebuilt"
              wheel_dir="$scratch/rebuilt"
            fi
            verify_venv="$scratch/$source-venv"
            uv venv --python "$python_bin" "$verify_venv"
            # Disposable consumer environments; never mutate the development checkout.
            uv pip install --python "$verify_venv/bin/python" --no-sources --torch-backend=cpu "$wheel_dir"/*.whl
            uv pip check --python "$verify_venv/bin/python"
            mkdir "$scratch/$source-run"
            cd "$scratch/$source-run"
            "$verify_venv/bin/python" -I -c "import manyruns; import manylatents.singlecell.preprocessing"
            "$verify_venv/bin/co-science" --version
            "$verify_venv/bin/co-science" check
            "$verify_venv/bin/co-science" run swissroll --recipe embed --engine mock --project release-smoke
            "$verify_venv/bin/python" -I - <<'PY'
          import json
          from pathlib import Path

          row, = [json.loads(line) for line in Path('outputs/index.jsonl').read_text().splitlines()]
          assert row['schema_version'] == 1
          assert row['run_id']
          PY
          done

  publish:
    needs: [build, verify]
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Attach verified distributions to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
              --title "$RELEASE_TAG" --generate-notes
          fi
