# MIOFlow on data with NO time axis, with the time axis INFERRED and declared by the recipe.
#
# The bundled `cflows` needs a real time axis: the MIOFlow tool's manifest says
# `needs: [embedding, time]`, so on unordered data `cflows` is blocked at plan time. This recipe
# is the honest alternative. It orders the cells (`dpt`, a diffusion pseudotime), bins that
# ordering into time points (`discretize_time`, which provides `time`), and then fits the flow
# against those bins. Every step of that is in the record; nothing is invented behind the user.
#
# NOT A FINDING about the direction of change: the time points and the flow fitted against them
# come from the same embedding, so the trajectory restates the ordering. `discretize_time` never
# overwrites real time labels: on data that has them it declines, and the flow uses the real
# axis.
#
# Use it from a manyruns checkout, with this folder on the recipe path and the tool folder on the
# tool search path:
#   export MANYRUNS_RECIPE_DIR="$PWD/examples/tools/mioflow/recipes"
#   export MANYRUNS_TOOL_PATH="$PWD/examples/tools/mioflow"
name: cflows_inferred
id: sc.traj.mioflow_inferred

source:
  kind: paper
  cite: "Huguet et al., Manifold Interpolating Optimal-Transport Flows for Trajectory
    Inference, NeurIPS 35:29705-29718 (2022)"
  doi:  "10.48550/arXiv.2206.14928"
  url:  "https://arxiv.org/abs/2206.14928"
  verified: 2026-07-29
  note: "Same method as the bundled `cflows`; the time axis here is a binned diffusion
    pseudotime, declared by the `dpt` and `discretize_time` steps."

claims: single-trajectory

steps:
  - {name: normalize, group: prep,   params: {target_sum: 10000}, via: manylatents}
  - {name: transform, group: prep,   params: {method: log1p},     via: manylatents}
  - {name: pca,       group: latent, params: {n_components: 50},
     limits: {n_components: [n_samples, n_features]},          via: manylatents}
  - {name: phate,           group: latent,    params: {n_components: 3}, via: manylatents}
  - {name: dpt,             group: analysis,  params: {},                via: manyruns}
  - {name: discretize_time, group: analysis,  params: {n_timepoints: 5}}
  - {name: mioflow,         group: lightning, params: {}, tool: mioflow}

question: "Trace an inferred path — I'll infer a time axis from a pseudotime, then fit the flow on it"
suits:    [manifold, unknown]
