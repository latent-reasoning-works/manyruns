# A second manifold with different topology (a hole). Paired with swissroll it asks whether
# a metric tracks "manifold-ness" or merely one particular manifold.
name: torus
handle: {kind: manylatents, ref: torus}
modality: synthetic
shape: manifold

# topology: the scShapeBench axis (additive; see vocab.TOPOLOGIES)
topology: [cycle, surface]
design:   single

# manylatents 0.1.6, seed 42: training/fit set (not the full generated tensor).
dims: {n_samples: 794, n_features: 100}
