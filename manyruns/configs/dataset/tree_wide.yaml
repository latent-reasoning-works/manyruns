# Shape-pack member — a synthetic point cloud whose TOPOLOGY is definitional.
#
# `topology` is the scShapeBench label (arXiv:2605.12662); it is ground truth here because the
# generator produced it, not because anyone annotated it. `shape` is the older, single-valued
# vocabulary and is kept for compatibility — note it CANNOT express this dataset (a 20-branch tree is not a `manifold`, but no closer word exists),
# which is the concrete argument for the topology/design split.
name:     tree_wide
handle:   {kind: manylatents, ref: dla_tree}
params:   {n_branch: 20, sigma: 4}
modality: synthetic
shape:    manifold
topology: [multi-branching]
design:   single

# manylatents 0.1.6, seed 42: training/fit set (not the full generated tensor).
dims: {n_samples: 2000, n_features: 3}
