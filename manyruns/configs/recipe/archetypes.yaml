# The extremes rather than the middle. Archetypal analysis fits a simplex whose vertices are
# extremal specialists and describes every cell as a mixture of them — a different question
# from clustering, which asks which group a cell belongs to.
#
# RUNNABLE SINCE manylatents 0.1.9 (the `manylatents>=0.1.9` bound in `pyproject.toml`). That
# release fixed both `aa` failures: the `method` keyword arguments the `archetypes` package no
# longer takes, and the scikit-learn validation hook it no longer has. The recipe carried a
# `blocked:` field until then, which `narrate.unavailable` read to draw a hollow ledger row.
name: archetypes
id:   sc.archetype.aa

source:
  kind:  paper
  cite:  "Cutler & Breiman, 'Archetypal Analysis', Technometrics 36(4):338-347 (1994)"
  doi:   10.1080/00401706.1994.10485840
  url:   https://www.tandfonline.com/doi/abs/10.1080/00401706.1994.10485840
  verified: 2026-07-28
  note:  "`aa` fits through manylatents (>=0.1.9) with 3 archetypes. AAnet — the deep variant, IEEE Big Data 2019 / Cancer Discovery 2025 — is a separate method and is not this recipe."

steps:
  # THE PREAMBLE, DECLARED. These ran on every counts-like load inside
  # `loading._anndata_matrix` and appeared in no trace, no g-vector and no caveat; their params
  # were unreachable from a recipe. What RUNS is unchanged — except the PCA, which is NOT repeated here: this recipe already
  # declares its own `pca` below, and the preamble's PCA-50 fed it a matrix that was
  # already 50 components wide. That double PCA is removed rather than reproduced, so this
  # recipe's geometry metrics move (spec §7.2b). What changed is that it is
  # written down, settable, and recorded.
  - {name: normalize, group: prep,   params: {target_sum: 10000}, via: manylatents}
  - {name: transform, group: prep,   params: {method: log1p},     via: manylatents}
  - {name: pca,     group: latent,   params: {n_components: 10},
     limits: {n_components: [n_samples, n_features]}, via: manylatents}
  # 3 archetypes, not the engine default of 50: a simplex with more vertices than the data
  # has extremes is not a description of it, and the test fixture has few.
  - {name: aa,      group: latent,   params: {n_components: 3},  via: manylatents}
  - {name: simplex, group: analysis, params: {},                 via: manyruns}

question: "What are the extremes? — I'll find the specialists and describe everything else as a mixture of them"
# Extremes are a specific question, not a default. Recommending it on `unknown` is how the
# alphabet came to pick the default recipe — measured: with a broad `suits`, five recipes
# recommended themselves for a plain folder and `archetypes` won on the letter A, silently
# replacing `embed` as what a scientist gets for data with no declared shape.
suits:    [manifold]

# A simplex with extremal vertices — `score.RUNG` grades it rung 4, the strongest structural
# claim in the ladder. `aa` fits the archetypes and `simplex` describes every cell as a mixture
# of them; nothing weaker would be honest, and nothing stronger exists.
#
# This is the ONLY recipe that claims rung 4. `score.unroutable_rungs()` reads what recipes
# CLAIM; `score.unroutable_rungs(offer)` reads what is OFFERED and runnable, and `manyruns check`
# prints that answer as its ladder line. The two answers agree now that this recipe runs. The
# rung-support gate has no rule for `archetypal`, so it never refuses this claim.
claims: archetypal
